services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahakar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahakar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahakar_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-sahakar}
    ports:
      - "5432:5432"
    volumes:
      - sahakar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahakar} -d ${POSTGRES_DB:-sahakar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sahakar_pgdata:
